<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin — Adage Day 2026</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: system-ui, sans-serif;
        background-color: #fff8f3;
        margin: 0;
        padding-bottom: 60px;
      }
      h1, h2, h3 {
        font-family: "Poppins", sans-serif;
      }
      .card {
        background: white;
        padding: 18px;
        border-radius: 20px;
        border: 1px solid #edf2f2;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        margin-bottom: 16px;
      }
      .place-row {
        border-top: 1px solid #f0f0f0;
        padding: 10px 0;
      }
      .place-row:first-of-type {
        border-top: none;
      }
      .team-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid #ddd;
        background: white;
        cursor: pointer;
        user-select: none;
        transition: all 0.15s ease;
      }
      .team-chip input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .team-chip.selected {
        background-color: #008b94;
        color: white;
        border-color: #00727a;
      }
      .unsaved-dot {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: #c9862a;
      }
      .unsaved-dot::before {
        content: "●";
        font-size: 9px;
      }
      input[type="text"], input[type="password"], input[type="number"], textarea, select {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 13px;
        width: 100%;
        font-family: inherit;
      }
      button.primary {
        background-color: #008b94;
        color: white;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
      }
      button.primary:hover {
        background-color: #00727a;
      }
      button.danger {
        color: #d33;
        font-size: 12px;
        font-weight: 600;
      }
      .ann-item {
        border-top: 1px solid #f0f0f0;
        padding: 8px 0;
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 10px;
        font-size: 13px;
      }
      .ann-item:first-of-type {
        border-top: none;
      }
      .admin-tab-btn {
        flex: 1;
        padding: 8px 0;
        border-radius: 25px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid transparent;
        background: none;
      }
      .admin-tab-btn.active {
        background-color: #008b94;
        color: white;
        box-shadow: 0 4px 8px rgba(0, 115, 122, 0.25);
      }
    </style>
  </head>

  <body class="text-gray-800">
    <header class="shadow-sm bg-white">
      <div class="max-w-4xl mx-auto py-4 px-6 flex justify-between items-center">
        <span class="text-lg font-extrabold tracking-wide text-[#008B94] uppercase">
          Adage Day 2026 — Admin
        </span>
        <button id="signOutBtn" class="hidden text-xs text-gray-500 hover:text-[#008B94]">
          Sign Out
        </button>
      </div>
    </header>

    <!-- Login -->
    <section id="loginSection" class="max-w-sm mx-auto px-4 py-16">
      <div class="card">
        <h2 class="text-lg font-semibold text-[#008B94] mb-4 text-center">Admin Sign In</h2>
        <form id="loginForm" class="space-y-3">
          <input type="text" id="email" placeholder="Email" autocomplete="username" />
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
          <button id="signInBtn" type="submit" class="primary w-full">Sign In</button>
          <p id="loginError" class="text-xs text-red-500 text-center"></p>
        </form>
      </div>
    </section>

    <!-- Score entry + announcements (shown after sign-in) -->
    <section id="adminSection" class="hidden max-w-2xl mx-auto px-4 py-8">
      <p class="text-xs text-gray-500 mb-4 text-center">
        Changes here show up on the public pages immediately for everyone — no refresh, no code edits.
      </p>

      <div class="flex justify-center mb-6 bg-white rounded-full shadow-md p-1 w-full max-w-xs mx-auto">
        <button onclick="showAdminTab('scores')" id="scoresTabBtn" class="admin-tab-btn active">Scores</button>
        <button onclick="showAdminTab('announcements')" id="announcementsTabBtn" class="admin-tab-btn">Announcements</button>
      </div>

      <div id="scoresTab">
        <div id="eventForms"></div>
      </div>

      <div id="announcementsTab" class="hidden">
        <div class="card">
          <div class="space-y-2">
            <input type="text" id="annTitle" placeholder="Title" />
            <textarea id="annBody" placeholder="Message" rows="2"></textarea>
            <div class="flex items-center gap-2">
              <select id="annCategory" class="flex-1">
                <option value="important">Important</option>
                <option value="reminder">Reminder</option>
                <option value="general" selected>General</option>
              </select>
              <span id="annCategoryPreview" class="text-[10px] font-medium px-2 py-1 rounded-full whitespace-nowrap"></span>
            </div>
            <div class="flex items-center gap-3">
              <button id="postAnnouncementBtn" class="primary">Post</button>
              <span id="announcementStatus" class="text-xs text-green-600"></span>
            </div>
          </div>
        </div>
        <div id="announcementsAdminList" class="card"></div>
      </div>
    </section>

    <script>
      function showAdminTab(tab) {
        document.getElementById("scoresTab").classList.toggle("hidden", tab !== "scores");
        document.getElementById("announcementsTab").classList.toggle("hidden", tab !== "announcements");
        document.getElementById("scoresTabBtn").classList.toggle("active", tab === "scores");
        document.getElementById("announcementsTabBtn").classList.toggle("active", tab === "announcements");
      }
    </script>
    <script type="module" src="static/js/admin.js"></script>
  </body>
</html>
