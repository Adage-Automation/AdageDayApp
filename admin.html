<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin, Adage Day 2026</title>
    <link rel="icon" type="image/png" href="static/images/25-JGS-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <meta name="theme-color" content="#061820" />
    <link rel="stylesheet" href="static/css/theme.css?v=11" />

    <style>
      body {
        font-family: system-ui, sans-serif;
        background-color: #fff8f3;
        margin: 0;
        padding-bottom: 60px;
      }
      h1, h2, h3 {
        font-family: "Poppins", sans-serif;
      }
      .card {
        background: white;
        padding: 18px;
        border-radius: 20px;
        border: 1px solid #edf2f2;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        margin-bottom: 16px;
      }
      .place-row {
        border-top: 1px solid #f0f0f0;
        padding: 10px 0;
      }
      .place-row:first-of-type {
        border-top: none;
      }
      .team-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        min-height: 40px;
        padding: 8px 14px;
        border-radius: 20px;
        border: 1px solid #ddd;
        background: white;
        cursor: pointer;
        user-select: none;
        transition: background-color 0.15s var(--ease-premium, ease), border-color 0.15s var(--ease-premium, ease),
          color 0.15s var(--ease-premium, ease), transform 0.15s var(--ease-premium, ease);
      }
      .team-chip:active { transform: scale(0.96); }
      .team-chip input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .team-color-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 1px solid #6b7280;
        border-radius: 50%;
        flex: 0 0 auto;
      }
      .team-chip.selected {
        background-color: #008b94;
        color: white;
        border-color: #00727a;
      }
      .unsaved-dot {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: #c9862a;
      }
      .unsaved-dot::before {
        content: "●";
        font-size: 9px;
      }
      /* 16px stops iPhones zooming in on focus; ids beat Tailwind's preflight. */
      #loginForm input, #annForm input, #annForm textarea, #annForm select {
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 16px;
        width: 100%;
        font-family: inherit;
      }
      #annForm select option { background: #0b1e22; color: #f1fbfc; }
      .field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-mid); margin-bottom: 4px; }
      .field-hint { font-size: 11px; color: var(--text-faint); text-align: right; margin-top: 2px; }
      button.primary, button.ghost {
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        min-height: 44px;
      }
      button.primary { background-color: #008b94; color: white; }
      button.ghost { color: var(--text-mid); border: 1px solid var(--border-teal); }
      button:disabled { opacity: 0.6; cursor: wait; }
      button:focus-visible, summary:focus-visible, .team-chip:focus-within {
        outline: 2px solid var(--gold-soft);
        outline-offset: 2px;
      }
      button.primary:hover {
        background-color: #00727a;
      }
      button.danger, button.link {
        font-size: 13px;
        font-weight: 600;
        padding: 6px 4px;
      }
      button.danger { color: #f87171; }
      button.link { color: var(--teal-soft); }
      /* Event cards collapse so the day's 6 events fit on one screen. */
      details.card > summary {
        list-style: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        min-height: 44px;
      }
      details.card > summary::-webkit-details-marker { display: none; }
      details.card > summary::after {
        content: "expand_more";
        font-family: "Material Icons";
        font-size: 24px;
        color: var(--text-dim);
        transition: transform 0.2s var(--ease-premium, ease);
      }
      details.card[open] > summary::after { transform: rotate(180deg); }
      details.card[open] > summary { margin-bottom: 8px; }
      .event-status { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
      .event-status.done { color: var(--gold-soft); }
      .ann-item {
        border-top: 1px solid #f0f0f0;
        padding: 8px 0;
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 10px;
        font-size: 14px;
      }
      .ann-item:first-of-type {
        border-top: none;
      }
      /* Announcement card preview: matches the public pages' .update/.tag
         component (static/css/site.css) so admin's preview looks like what
         people will actually see, even though admin.html itself stays on
         the plain theme.css layout. */
      .update {
        position: relative;
        padding: 14px 14px 14px 18px;
        border-radius: 14px;
        background: linear-gradient(160deg, rgba(25, 195, 209, 0.07), rgba(7, 20, 24, 0.9));
        border: 1px solid var(--border-teal-soft);
        overflow: hidden;
      }
      .update::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--teal); box-shadow: 0 0 10px var(--teal); }
      .update.is-gold::before { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
      .update.is-red::before { background: #ff5a5a; box-shadow: 0 0 10px #ff5a5a; }
      .update-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .tag { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; color: var(--teal-soft); background: rgba(25, 195, 209, 0.12); border: 1px solid rgba(127, 233, 239, 0.3); }
      .tag.gold { color: var(--gold-soft); background: rgba(216, 180, 95, 0.12); border-color: rgba(240, 216, 151, 0.35); }
      .tag.red { color: #ffd9d9; background: rgba(255, 90, 90, 0.14); border-color: rgba(255, 120, 120, 0.35); }
      .update time { font-size: 11px; color: var(--text-dim); }
      .update h3 { margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--text-hi); }
      .update p { margin-top: 4px; font-size: 12.5px; line-height: 1.5; color: var(--text-dim); white-space: pre-line; }
      .admin-tab-btn {
        flex: 1;
        padding: 8px 0;
        border-radius: 25px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid transparent;
        background: none;
      }
      .admin-tab-btn.active {
        background-color: #008b94;
        color: white;
        box-shadow: 0 4px 8px rgba(0, 115, 122, 0.25);
      }
    </style>
  </head>

  <body class="text-gray-800">
    <header class="shadow-sm bg-white">
      <div class="max-w-4xl mx-auto py-4 px-6 flex justify-between items-center">
        <span class="flex items-center gap-2.5">
          <img src="static/images/25-JGS.png" alt="Adage Day 2026" class="nav-logo" />
          <span class="brand-wordmark text-sm sm:text-lg font-extrabold tracking-[0.15em] uppercase">
            <span class="text-white">Adage</span> <span class="text-[#19c3d1]">Day 2026</span>
          </span>
          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border border-[#d8b45f]/50 text-[#f0d897]">Admin</span>
        </span>
        <button id="signOutBtn" class="hidden whitespace-nowrap text-sm text-gray-500 hover:text-[#008B94] px-2 py-2">
          Sign Out
        </button>
      </div>
    </header>

    <!-- Login -->
    <section id="loginSection" class="max-w-sm mx-auto px-4 py-16">
      <div class="card">
        <h2 class="text-lg font-semibold text-[#008B94] mb-4 text-center">Admin Sign In</h2>
        <form id="loginForm" class="space-y-3">
          <input type="email" id="email" placeholder="Email" autocomplete="username" aria-label="Email" required />
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required />
          <button id="signInBtn" type="submit" class="primary w-full">Sign In</button>
          <p id="loginError" class="text-xs text-red-500 text-center"></p>
        </form>
      </div>
    </section>

    <!-- Score entry + announcements (shown after sign-in) -->
    <section id="adminSection" class="hidden max-w-2xl mx-auto px-4 py-8">
      <p class="text-xs text-gray-500 mb-4 text-center">
        Changes here show up on the public pages immediately for everyone: no refresh, no code edits.
      </p>

      <div class="flex justify-center mb-6 bg-white rounded-full shadow-md p-1 w-full max-w-xs mx-auto">
        <button onclick="showAdminTab('scores')" id="scoresTabBtn" class="admin-tab-btn active">Scores</button>
        <button onclick="showAdminTab('announcements')" id="announcementsTabBtn" class="admin-tab-btn">Announcements</button>
      </div>

      <div id="scoresTab">
        <div id="prizePoolSummary" class="card"></div>
        <div id="eventForms"></div>
      </div>

      <div id="announcementsTab" class="hidden">
        <form id="annForm" class="card space-y-3" novalidate>
          <h3 id="annFormTitle" class="text-base font-semibold text-[#008B94]">New announcement</h3>
          <div>
            <label for="annTitle" class="field-label">Title</label>
            <input type="text" id="annTitle" maxlength="80" />
          </div>
          <div>
            <label for="annBody" class="field-label">Message</label>
            <textarea id="annBody" rows="3" maxlength="500"></textarea>
            <p id="annBodyCount" class="field-hint">0 / 500</p>
          </div>
          <div>
            <label for="annCategory" class="field-label">Category</label>
            <select id="annCategory">
              <option value="important">Important</option>
              <option value="reminder">Reminder</option>
              <option value="general" selected>General</option>
            </select>
          </div>
          <div>
            <p class="field-label">Preview</p>
            <div id="annPreview"></div>
          </div>
          <div class="flex items-center gap-3 flex-wrap">
            <button id="postAnnouncementBtn" type="submit" class="primary">Post</button>
            <button id="cancelEditBtn" type="button" class="ghost hidden">Cancel</button>
            <span id="announcementStatus" class="text-sm" role="status"></span>
          </div>
        </form>
        <div id="announcementsAdminList" class="card"></div>
      </div>
    </section>

    <script>
      function showAdminTab(tab) {
        document.getElementById("scoresTab").classList.toggle("hidden", tab !== "scores");
        document.getElementById("announcementsTab").classList.toggle("hidden", tab !== "announcements");
        document.getElementById("scoresTabBtn").classList.toggle("active", tab === "scores");
        document.getElementById("announcementsTabBtn").classList.toggle("active", tab === "announcements");
      }
    </script>
    <script type="module" src="static/js/admin.js"></script>
  </body>
</html>
